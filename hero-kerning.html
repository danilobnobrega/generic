<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>GENERIC — Hero (kerning)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Tinos:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div class="vignette"></div>

    <div class="hero">
      <div class="stage">
        <div class="metrics" id="metrics">
          <span>GENERIC</span><span>7&nbsp;glyphs</span><span>kerning:&nbsp;manual</span>
          <span id="m-track">tracking&nbsp;0.000&nbsp;em</span>
          <span id="m-status" class="m-status">idle</span>
        </div>
        <div class="eyebrow">We are</div>
        <div class="word" id="word" aria-label="GENERIC">
          <svg class="tool" id="tool" aria-hidden="true"></svg>
        </div>
      </div>
    </div>

    <div class="footer">
      <span>generic.bargains</span>
      <button class="snd" id="snd" type="button" aria-pressed="true">sound: on</button>
      <span class="scroll">scroll</span>
    </div>


    <script type="module" src="/src/hero/kerning.ts"></script>
  </body>
</html>
