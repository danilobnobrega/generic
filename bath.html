<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>GENERIC — Bath</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { background: #f1f0ea; }
      #webgl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
      }
      /* just gives the page something to scroll through */
      .scroll-space { height: 340vh; pointer-events: none; }
      .hint {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 2;
        font: 400 11px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #15150e;
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>
    <div class="scroll-space"></div>
    <div class="hint">scroll</div>
    <script type="module" src="/src/bath/main.ts"></script>
  </body>
</html>
